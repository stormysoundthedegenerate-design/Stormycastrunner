# Runs Stormycast after each ECMWF run and publishes it to the `stormycast`
# branch of the nexradar Cloudflare Pages project (https://stormycast.nexradar.pages.dev).
# 00Z and 12Z do all five days; 06Z and 18Z only update day 1 (each place's next afternoon).
# Needs the repository secrets STORMYCAST_TOKEN (a Cloudflare API token, Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
#
# Split over several machines so the forecast comes out sooner: one job names the run, five
# work out a GEFS member each at the same time, and the main job does ECMWF and HRRR, takes
# the members' parts (working out any that failed itself) and publishes. Saving RRFS for
# training runs on its own beside them and can never hold up or break the forecast.
name: Stormycast

on:
  schedule:
    # ECMWF's open data lands about 7.6 h after the 00Z/12Z runs (07:35, 19:35 UTC) and 6.5 h
    # after 06Z/18Z (12:30, 00:30). GitHub usually starts timed jobs late; one that starts
    # before the data waits for it (up to 45 min), and one whose run is already live stops.
    - cron: '15 7 * * *'
    - cron: '10 12 * * *'
    - cron: '15 19 * * *'
    - cron: '10 0 * * *'
  workflow_dispatch:

concurrency:
  group: stormycast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      run: ${{ steps.run.outputs.run }}
      go: ${{ steps.run.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Name the run
        id: run
        run: |
          OUT=$(node scripts/stormycast-run.mjs --print-run --wait=45 ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }})
          echo "$OUT"
          RUN=$(echo "$OUT" | sed -n 's/^RUN=//p')
          GO=$(echo "$OUT" | sed -n 's/^GO=//p')
          test -n "$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

  gefs:
    needs: prep
    if: ${{ needs.prep.outputs.go == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        member: [gec00, gep01, gep02, gep03, gep04]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Work out GEFS ${{ matrix.member }}
        run: node --max-old-space-size=6000 scripts/stormycast-run.mjs ${{ needs.prep.outputs.run }} --gefs-member=${{ matrix.member }} --gefs-out=gefs-parts --no-score
      - uses: actions/upload-artifact@v7
        with:
          name: gefs-${{ matrix.member }}
          path: gefs-parts/
          if-no-files-found: ignore
          retention-days: 1

  run:
    needs: [prep, gefs]
    if: ${{ always() && needs.prep.result == 'success' && needs.prep.outputs.go == 'yes' }}
    runs-on: ubuntu-latest
    # ECMWF and HRRR, plus any GEFS member whose own job failed.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write # only for the keep-alive step below
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Wrangler
        run: npm install -g wrangler@4
      - name: Keep the days already published
        run: node scripts/stormycast-pull.mjs
      - name: Take the GEFS members' parts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: gefs-*
          path: gefs-parts
          merge-multiple: true
      - name: Run Stormycast and publish
        # Spaces or line breaks pasted in with the secrets are dropped.
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          node --max-old-space-size=6000 scripts/stormycast-run.mjs ${{ needs.prep.outputs.run }} --gefs-from=gefs-parts --deploy
        env:
          CF_TOKEN: ${{ secrets.STORMYCAST_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # GitHub pauses a public repository's scheduled workflows after 60 days without a
      # commit; Stormycast publishes to Cloudflare and never commits, so each run switches
      # its own schedule back on.
      - name: Keep the schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/stormycast.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}

  # Every run kept for the record on the archive branch (scripts/stormycast-archive.mjs):
  # its day files as published, with a run.json. Whatever is live and not yet there is
  # added, so a run whose archiving failed is caught by the next. Never holds up the forecast.
  archive:
    needs: [prep, run]
    if: ${{ always() && needs.run.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: write # only to add files to the archive branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Archive the run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin archive; then
            git worktree add archive FETCH_HEAD
            git -C archive switch -c archive
          else
            git worktree add --orphan -b archive archive
          fi
          # Another run's archiving may push first: then start again from what it pushed
          # (the script only ever adds what is missing).
          for i in 1 2 3; do
            node scripts/stormycast-archive.mjs archive
            git -C archive add -A
            git -C archive diff --cached --quiet && break
            git -C archive commit -q -m "Run ${{ needs.prep.outputs.run }}"
            git -C archive push origin archive && break
            git -C archive fetch --depth=1 origin archive && git -C archive reset -q --hard FETCH_HEAD
          done

  # RRFS (NOAA's new storm-scale model) and REFS (its ensemble) are kept for training a
  # Stormycast model on them: NOMADS holds only their last two days, so each 00Z run's inputs
  # at the US scoring points go to the rrfs-data branch. Runs already there are skipped.
  rrfs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write # only to add files to the rrfs-data branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Save RRFS and REFS for training
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin rrfs-data; then
            git worktree add rrfs-data FETCH_HEAD
            git -C rrfs-data switch -c rrfs-data
          else
            git worktree add --orphan -b rrfs-data rrfs-data
          fi
          node scripts/stormycast-rrfs-save.mjs rrfs-data || echo "RRFS save failed"
          node scripts/stormycast-refs-save.mjs rrfs-data || echo "REFS save failed"
          git -C rrfs-data add -A
          if ! git -C rrfs-data diff --cached --quiet; then
            git -C rrfs-data commit -q -m "RRFS $(date -u +%Y-%m-%d)"
            git -C rrfs-data push origin rrfs-data
          fi
