# Runs Stormycast after each ECMWF run (00Z and 12Z) and publishes it to the `stormycast`
# branch of the nexradar Cloudflare Pages project (https://stormycast.nexradar.pages.dev).
# Needs the repository secrets STORMYCAST_TOKEN (a Cloudflare API token, Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Stormycast

on:
  schedule:
    # ECMWF's open data is complete about 8 h after each run; GitHub may start a little late.
    - cron: '40 8 * * *'
    - cron: '40 20 * * *'
  workflow_dispatch:

concurrency:
  group: stormycast
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # only for the keep-alive step below

jobs:
  run:
    runs-on: ubuntu-latest
    # ECMWF, five GEFS members and HRRR: about 30-60 minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Wrangler
        run: npm install -g wrangler@4
      - name: Keep the days already published
        run: node scripts/stormycast-pull.mjs
      - name: Run Stormycast and publish
        # Spaces or line breaks pasted in with the secrets are dropped.
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          node --max-old-space-size=6000 scripts/stormycast-run.mjs --deploy
        env:
          CF_TOKEN: ${{ secrets.STORMYCAST_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # GitHub pauses a public repository's scheduled workflows after 60 days without a
      # commit; Stormycast publishes to Cloudflare and never commits, so each run switches
      # its own schedule back on.
      - name: Keep the schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/stormycast.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
